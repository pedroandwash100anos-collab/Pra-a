<!DOCTYPE html>
<html lang="pt-BR" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Praça</title>
<style>
:root{--bg:#fafafa;--side:#f0f0f0;--card:#fff;--text:#1a1a1a;--muted:#777;--line:#e2e2e2;--acc:#4f5bd5;color-scheme:light}
@media (prefers-color-scheme:dark){html[data-theme="auto"]{--bg:#161616;--side:#1d1d1d;--card:#242424;--text:#ececec;--muted:#999;--line:#333;--acc:#8a94ff;color-scheme:dark}}
html[data-theme="dark"]{--bg:#161616;--side:#1d1d1d;--card:#242424;--text:#ececec;--muted:#999;--line:#333;--acc:#8a94ff;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
input,textarea,select,button{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
button{cursor:pointer}
button.p{background:var(--acc);color:#fff;border-color:var(--acc)}
button.g{background:none;border:0;color:var(--muted)}
.hide{display:none!important}
#auth{height:100%;display:flex;flex-direction:column;justify-content:center;gap:10px;max-width:320px;margin:auto;padding:20px}
#auth h1{font-weight:500;margin:0 0 6px}
#err{color:#c33;min-height:1.2em;font-size:13px}
#app{height:100%;display:flex}
#side{width:220px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:10px;gap:6px}
#rooms{flex:1;overflow:auto;display:flex;flex-direction:column;gap:2px}
.r{text-align:left;border:0;background:none;padding:7px 10px}
.r.on{background:var(--card);font-weight:600}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#top{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
#top b{flex:1}
#msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.m .n{font-weight:600;cursor:pointer;font-size:13px}
.m .t{color:var(--muted);font-size:11px;margin-left:6px}
.m div.b{overflow-wrap:anywhere;white-space:pre-wrap}
#f{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
#f input{flex:1;min-width:0}
.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;padding:16px}
.box{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:18px;width:100%;max-width:380px;max-height:90%;overflow:auto;display:flex;flex-direction:column;gap:8px}
.box label{font-size:13px;color:var(--muted)}
@media (max-width:600px){#side{width:120px}}
</style>
</head>
<body>
<div id="auth">
  <h1>Praça</h1>
  <input id="us" placeholder="Nome de usuário (só no cadastro)" maxlength="24">
  <input id="em" type="email" placeholder="E-mail" autocomplete="email">
  <input id="pw" type="password" placeholder="Senha (mín. 6 caracteres)" autocomplete="current-password">
  <div id="err"></div>
  <button class="p" id="bin">Entrar</button>
  <button class="g" id="bup">Criar conta</button>
</div>

<div id="app" class="hide">
  <div id="side">
    <b>Praça</b>
    <div id="rooms"></div>
    <button id="bnew">+ Nova sala</button>
    <button id="bjoin">Entrar com código</button>
    <button id="bset">Perfil e ajustes</button>
  </div>
  <div id="main">
    <div id="top"><b id="rn">Escolha uma sala</b><button class="g" id="bcode"></button></div>
    <div id="msgs"></div>
    <form id="f"><input id="tx" maxlength="2000" placeholder="Mensagem" autocomplete="off"><button class="p">Enviar</button></form>
  </div>
</div>

<div id="mo" class="modal hide"><div class="box" id="mb"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
// SB_URL e SB_KEY vêm do arquivo config.js
const sb = supabase.createClient(SB_URL, SB_KEY);
const $ = id => document.getElementById(id);
let me = null, prof = null, rooms = [], room = null, chan = null, cache = {};

function el(t, c, x){ const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; }

// ---------- login ----------
async function auth(up){
  $("err").textContent = "";
  const email = $("em").value.trim(), password = $("pw").value;
  const r = up
    ? await sb.auth.signUp({ email, password, options: { data: { username: $("us").value.trim() || email.split("@")[0] } } })
    : await sb.auth.signInWithPassword({ email, password });
  if (r.error) { $("err").textContent = r.error.message; return; }
  if (up && !r.data.session) $("err").textContent = "Conta criada. Confirme pelo link enviado ao seu e-mail e depois entre.";
}
$("bin").onclick = () => auth(false);
$("bup").onclick = () => auth(true);

sb.auth.onAuthStateChange((_e, s) => {
  if (s && s.user) { if (!me || me.id !== s.user.id) { me = s.user; start(); } }
  else { me = null; $("app").classList.add("hide"); $("auth").classList.remove("hide"); }
});

async function start(){
  const { data } = await sb.from("profiles").select("*").eq("id", me.id).single();
  prof = data; cache[me.id] = data;
  document.documentElement.dataset.theme = prof.theme;
  $("auth").classList.add("hide"); $("app").classList.remove("hide");
  await loadRooms();
  if (rooms.length) openRoom(rooms[0]);
}

// ---------- salas ----------
async function loadRooms(){
  const { data } = await sb.from("rooms").select("*").order("created_at");
  rooms = data || [];
  const box = $("rooms"); box.textContent = "";
  rooms.forEach(r => {
    const b = el("button", "r" + (room && room.id === r.id ? " on" : ""), "# " + r.name);
    b.onclick = () => openRoom(r);
    box.appendChild(b);
  });
}

async function ensure(ids){
  const need = ids.filter(i => !cache[i]);
  if (!need.length) return;
  const { data } = await sb.from("profiles").select("*").in("id", need);
  (data || []).forEach(p => cache[p.id] = p);
}

function addMsg(m){
  const p = cache[m.user_id] || { username: "?", emoji: "🙂", color: "#888" };
  const d = el("div", "m");
  const n = el("span", "n", p.emoji + " " + p.username); n.style.color = p.color;
  n.onclick = () => card(m.user_id);
  d.appendChild(n);
  d.appendChild(el("span", "t", new Date(m.created_at).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })));
  d.appendChild(el("div", "b", m.body));
  const box = $("msgs"); box.appendChild(d); box.scrollTop = box.scrollHeight;
}

async function openRoom(r){
  room = r;
  if (chan) sb.removeChannel(chan);
  $("rn").textContent = "# " + r.name;
  $("bcode").textContent = "Código: " + r.code;
  $("msgs").textContent = "";
  loadRooms();
  const { data } = await sb.from("messages").select("*").eq("room_id", r.id).order("created_at", { ascending: false }).limit(100);
  const list = (data || []).reverse();
  await ensure([...new Set(list.map(m => m.user_id))]);
  if (!room || room.id !== r.id) return;
  list.forEach(addMsg);
  chan = sb.channel("room-" + r.id)
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "messages", filter: "room_id=eq." + r.id },
      async p => { await ensure([p.new.user_id]); if (room && room.id === r.id) addMsg(p.new); })
    .subscribe();
}

$("f").onsubmit = async e => {
  e.preventDefault();
  const body = $("tx").value.trim();
  if (!body || !room) return;
  $("tx").value = "";
  const { error } = await sb.from("messages").insert({ room_id: room.id, user_id: me.id, body });
  if (error) alert("Não enviou: " + error.message);
};

// ---------- janelas ----------
function modal(build){
  const b = $("mb"); b.textContent = "";
  build(b);
  const x = el("button", "g", "Fechar"); x.onclick = () => $("mo").classList.add("hide");
  b.appendChild(x);
  $("mo").classList.remove("hide");
}
function field(b, label, input){ b.appendChild(el("label", null, label)); b.appendChild(input); return input; }

function card(id){
  const p = cache[id]; if (!p) return;
  modal(b => {
    b.appendChild(el("b", null, p.emoji + " " + p.username));
    b.appendChild(el("div", null, (p.show_bio || id === me.id) ? (p.bio || "Sem bio.") : "Este perfil mantém a bio privada."));
  });
}

$("bnew").onclick = () => modal(b => {
  const n = field(b, "Nome da sala", el("input")); n.maxLength = 40;
  const ok = el("button", "p", "Criar");
  ok.onclick = async () => {
    if (!n.value.trim()) return;
    const { data, error } = await sb.rpc("create_room", { n: n.value.trim() });
    if (error) return alert(error.message);
    $("mo").classList.add("hide"); await loadRooms();
    openRoom(rooms.find(r => r.id === data));
  };
  b.appendChild(ok);
});

$("bjoin").onclick = () => modal(b => {
  const c = field(b, "Código da sala", el("input"));
  const ok = el("button", "p", "Entrar");
  ok.onclick = async () => {
    const { data, error } = await sb.rpc("join_room", { c: c.value.trim() });
    if (error) return alert(error.message);
    $("mo").classList.add("hide"); await loadRooms();
    openRoom(rooms.find(r => r.id === data));
  };
  b.appendChild(ok);
});

$("bset").onclick = () => modal(b => {
  const us = field(b, "Nome de usuário", el("input")); us.value = prof.username; us.maxLength = 24;
  const em = field(b, "Emoji do perfil", el("input")); em.value = prof.emoji; em.maxLength = 4;
  const bio = field(b, "Bio", el("textarea")); bio.value = prof.bio; bio.maxLength = 200;
  const co = field(b, "Cor do nome", el("input")); co.type = "color"; co.value = prof.color;
  const th = field(b, "Tema", el("select"));
  [["auto", "Automático"], ["light", "Claro"], ["dark", "Escuro"]].forEach(o => { const op = el("option", null, o[1]); op.value = o[0]; th.appendChild(op); });
  th.value = prof.theme;
  b.appendChild(el("label", null, "Privacidade"));
  const lb = el("label"); const sh = el("input"); sh.type = "checkbox"; sh.checked = prof.show_bio;
  lb.appendChild(sh); lb.appendChild(document.createTextNode(" Mostrar minha bio para os outros"));
  b.appendChild(lb);
  const ok = el("button", "p", "Salvar");
  ok.onclick = async () => {
    const upd = { username: us.value.trim() || prof.username, emoji: em.value.trim() || "🙂", bio: bio.value, color: co.value, theme: th.value, show_bio: sh.checked };
    const { error } = await sb.from("profiles").update(upd).eq("id", me.id);
    if (error) return alert(error.message);
    prof = Object.assign(prof, upd); cache[me.id] = prof;
    document.documentElement.dataset.theme = prof.theme;
    $("mo").classList.add("hide");
  };
  b.appendChild(ok);
  const out = el("button", "g", "Sair da conta"); out.onclick = () => { $("mo").classList.add("hide"); sb.auth.signOut(); };
  b.appendChild(out);
});
</script>
</body>
</html>
