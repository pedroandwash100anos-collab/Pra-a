<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Praça</title>
<style>
:root{--t:#1b2030;--m:#5b6479;--g:rgba(255,255,255,.5);--gb:rgba(255,255,255,.7);--in:rgba(255,255,255,.6);--acc:#5b6cff;--bg:linear-gradient(135deg,#dbe4ff,#f3e1ff 50%,#d9f3ff);color-scheme:light}
html[data-theme="dark"]{--t:#eef1ff;--m:#a3acc8;--g:rgba(255,255,255,.07);--gb:rgba(255,255,255,.16);--in:rgba(255,255,255,.1);--acc:#7c8aff;--bg:linear-gradient(135deg,#0f1230,#25123f 50%,#0b2a3a);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg) fixed;color:var(--t);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.glass{background:var(--g);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);border:1px solid var(--gb);border-radius:18px}
input,textarea,select,button{font:inherit;color:var(--t);background:var(--in);border:1px solid var(--gb);border-radius:10px;padding:8px 12px}
button{cursor:pointer}
button.p{background:var(--acc);color:#fff;border-color:transparent}
button.g{background:none;border-color:transparent;color:var(--m)}
.hide{display:none!important}
#auth{height:100%;display:flex;align-items:center;justify-content:center;padding:20px}
#auth .glass{width:100%;max-width:340px;padding:22px;display:flex;flex-direction:column;gap:10px}
#auth h1{margin:0;font-weight:500;letter-spacing:.5px}
#err{color:#e5484d;min-height:1.2em;font-size:13px}
#app{height:100%;display:flex;gap:10px;padding:10px;padding-top:max(10px,env(safe-area-inset-top));padding-bottom:max(10px,env(safe-area-inset-bottom))}
#rail{width:64px;padding:8px;display:flex;flex-direction:column;gap:8px;align-items:center;overflow-y:auto}
#rail .sp{flex:1}
.ic{width:46px;height:46px;border-radius:50%;padding:0;font-weight:700;flex:none}
.ic.on{background:var(--acc);color:#fff;border-radius:16px}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#top{display:flex;gap:6px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--gb)}
#top b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#call{padding:8px;border-bottom:1px solid var(--gb)}
#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.tile{position:relative}
.tile video{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;background:#0006;display:block}
.tile span{position:absolute;left:8px;bottom:6px;font-size:12px;color:#fff;text-shadow:0 1px 3px #000}
#ctl{display:flex;gap:8px;justify-content:center;margin-top:8px}
#msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.m{display:flex;gap:10px}
.av{width:36px;height:36px;border-radius:50%;background:var(--in);display:flex;align-items:center;justify-content:center;flex:none}
.m .n{font-weight:600;cursor:pointer;font-size:14px}
.m .t{color:var(--m);font-size:11px;margin-left:6px}
.m .b{overflow-wrap:anywhere;white-space:pre-wrap}
#f{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--gb)}
#f input{flex:1;min-width:0}
#mem{width:180px;padding:14px;overflow:auto}
#mem h4{margin:0 0 8px;font-size:12px;color:var(--m);text-transform:uppercase;letter-spacing:1px}
#mem div{padding:3px 0;font-size:14px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#3ecf8e;margin-right:6px}
@media (max-width:700px){#mem{position:fixed;right:10px;top:10px;bottom:10px;z-index:5;background:var(--gb)}}
.modal{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.box{width:100%;max-width:380px;max-height:90%;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:8px;background:var(--gb)!important}
.box label{font-size:13px;color:var(--m)}
.ok{color:#3ecf8e;font-size:13px;min-height:1.2em}
</style>
</head>
<body>
<div id="auth">
  <div class="glass">
    <h1>Praça</h1>
    <input id="us" placeholder="Nome de usuário (só no cadastro)" maxlength="24">
    <input id="em" type="email" placeholder="E-mail" autocomplete="email">
    <input id="pw" type="password" placeholder="Senha (mín. 6 caracteres)" autocomplete="current-password">
    <div id="err"></div>
    <button class="p" id="bin">Entrar</button>
    <button class="g" id="bup">Criar conta</button>
  </div>
</div>

<div id="app" class="hide">
  <div id="rail" class="glass"></div>
  <div id="main" class="glass">
    <div id="top"><b id="rn">Escolha uma sala</b><button class="g" id="bcode"></button><button id="bcall" class="hide">📹 Chamada</button><button class="g" id="bmem">👥</button></div>
    <div id="call" class="hide"><div id="grid"></div><div id="ctl"><button id="bmic">🎤</button><button id="bcam">📷</button><button class="p" id="bleave">Sair</button></div></div>
    <div id="msgs"></div>
    <form id="f"><input id="tx" maxlength="2000" placeholder="Mensagem" autocomplete="off"><button class="p">Enviar</button></form>
  </div>
  <div id="mem" class="glass"></div>
</div>
<div id="mo" class="modal hide"><div class="box glass" id="mb"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
const sb = supabase.createClient(SB_URL, SB_KEY);
const $ = id => document.getElementById(id);
let me = null, prof = null, rooms = [], room = null, chan = null, cache = {};
let sid = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Math.random()).slice(2);
let callCh = null, local = null, peers = {}, names = {};
const ICE = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };

function el(t, c, x){ const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; }
function theme(t){
  const d = t === "dark" || (t === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme = d ? "dark" : "light";
}
if (innerWidth < 700) $("mem").classList.add("hide");
$("bmem").onclick = () => $("mem").classList.toggle("hide");

// ---------- login ----------
async function auth(up){
  $("err").textContent = "";
  const email = $("em").value.trim(), password = $("pw").value;
  const r = up
    ? await sb.auth.signUp({ email, password, options: { data: { username: $("us").value.trim() || email.split("@")[0] } } })
    : await sb.auth.signInWithPassword({ email, password });
  if (r.error) { $("err").textContent = r.error.message; return; }
  if (up && !r.data.session) $("err").textContent = "Conta criada. Confirme pelo link enviado ao seu e-mail e depois entre.";
}
$("bin").onclick = () => auth(false);
$("bup").onclick = () => auth(true);

sb.auth.onAuthStateChange((_e, s) => {
  if (s && s.user) { if (!me || me.id !== s.user.id) { me = s.user; start(); } }
  else { leaveCall(); me = null; $("app").classList.add("hide"); $("auth").classList.remove("hide"); }
});

async function start(){
  const { data } = await sb.from("profiles").select("*").eq("id", me.id).single();
  prof = data; cache[me.id] = data; theme(prof.theme);
  $("auth").classList.add("hide"); $("app").classList.remove("hide");
  await loadRooms();
  if (rooms.length) openRoom(rooms[0]);
}

// ---------- salas ----------
async function loadRooms(){
  const { data } = await sb.from("rooms").select("*").order("created_at");
  rooms = data || [];
  const box = $("rail"); box.textContent = "";
  rooms.forEach(r => {
    const b = el("button", "ic" + (room && room.id === r.id ? " on" : ""), (r.name[0] || "?").toUpperCase());
    b.title = r.name; b.onclick = () => openRoom(r); box.appendChild(b);
  });
  box.appendChild(el("div", "sp"));
  [["+", "Nova sala", newRoom], ["→", "Entrar com código", joinRoom], ["⚙", "Perfil e ajustes", settings]].forEach(a => {
    const b = el("button", "ic", a[0]); b.title = a[1]; b.onclick = a[2]; box.appendChild(b);
  });
}

async function ensure(ids){
  const need = ids.filter(i => !cache[i]);
  if (!need.length) return;
  const { data } = await sb.from("profiles").select("*").in("id", need);
  (data || []).forEach(p => cache[p.id] = p);
}

function addMsg(m){
  const p = cache[m.user_id] || { username: "?", emoji: "🙂", color: "#888" };
  const d = el("div", "m"), body = el("div"), h = el("div");
  const n = el("span", "n", p.username); n.style.color = p.color; n.onclick = () => card(m.user_id);
  h.appendChild(n);
  h.appendChild(el("span", "t", new Date(m.created_at).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })));
  body.appendChild(h); body.appendChild(el("div", "b", m.body));
  d.appendChild(el("div", "av", p.emoji)); d.appendChild(body);
  const box = $("msgs"); box.appendChild(d); box.scrollTop = box.scrollHeight;
}

function online(state){
  const box = $("mem"); box.textContent = "";
  const list = Object.values(state).map(a => a[0]);
  box.appendChild(el("h4", null, "Online — " + list.length));
  list.forEach(u => {
    const d = el("div"); d.appendChild(el("span", "dot"));
    d.appendChild(document.createTextNode((u.e || "🙂") + " " + (u.n || "?"))); box.appendChild(d);
  });
}

async function openRoom(r){
  leaveCall();
  room = r;
  if (chan) sb.removeChannel(chan);
  $("rn").textContent = "# " + r.name;
  $("bcode").textContent = "Código: " + r.code;
  $("bcall").classList.remove("hide");
  $("msgs").textContent = "";
  loadRooms();
  const { data } = await sb.from("messages").select("*").eq("room_id", r.id).order("created_at", { ascending: false }).limit(100);
  const list = (data || []).reverse();
  await ensure([...new Set(list.map(m => m.user_id))]);
  if (!room || room.id !== r.id) return;
  list.forEach(addMsg);
  chan = sb.channel("room-" + r.id, { config: { presence: { key: me.id } } })
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "messages", filter: "room_id=eq." + r.id },
      async p => { await ensure([p.new.user_id]); if (room && room.id === r.id) addMsg(p.new); })
    .on("presence", { event: "sync" }, () => online(chan.presenceState()))
    .subscribe(async s => { if (s === "SUBSCRIBED") await chan.track({ n: prof.username, e: prof.emoji }); });
}

$("f").onsubmit = async e => {
  e.preventDefault();
  const body = $("tx").value.trim();
  if (!body || !room) return;
  $("tx").value = "";
  const { error } = await sb.from("messages").insert({ room_id: room.id, user_id: me.id, body });
  if (error) alert("Não enviou: " + error.message);
};

// ---------- chamada de vídeo (WebRTC entre os participantes) ----------
function tile(id, stream, mine, name){
  let t = $("tile-" + id);
  if (!t) {
    t = el("div", "tile"); t.id = "tile-" + id;
    const v = document.createElement("video"); v.autoplay = true; v.playsInline = true; v.muted = !!mine;
    t.appendChild(v); t.appendChild(el("span", null, name || "Alguém")); $("grid").appendChild(t);
  }
  t.querySelector("video").srcObject = stream;
}
function send(to, type, data){ callCh.send({ type: "broadcast", event: "sig", payload: { to, from: sid, type, data } }); }

function pcFor(id){
  if (peers[id]) return peers[id].pc;
  const pc = new RTCPeerConnection(ICE);
  peers[id] = { pc, q: [] };
  local.getTracks().forEach(t => pc.addTrack(t, local));
  pc.onicecandidate = e => { if (e.candidate) send(id, "ice", e.candidate); };
  pc.ontrack = e => tile(id, e.streams[0], false, names[id]);
  pc.onconnectionstatechange = () => { if (pc.connectionState === "failed" || pc.connectionState === "closed") dropPeer(id); };
  return pc;
}
function dropPeer(id){
  const p = peers[id]; if (!p) return;
  try { p.pc.close(); } catch (e) {}
  delete peers[id];
  const t = $("tile-" + id); if (t) t.remove();
}
async function offer(id){
  const pc = pcFor(id); const o = await pc.createOffer();
  await pc.setLocalDescription(o); send(id, "offer", o);
}
async function onSig(m){
  if (!local || m.to !== sid) return;
  const pc = pcFor(m.from), p = peers[m.from];
  try {
    if (m.type === "offer") {
      await pc.setRemoteDescription(m.data);
      for (const c of p.q.splice(0)) await pc.addIceCandidate(c);
      const a = await pc.createAnswer(); await pc.setLocalDescription(a); send(m.from, "answer", a);
    } else if (m.type === "answer") {
      await pc.setRemoteDescription(m.data);
      for (const c of p.q.splice(0)) await pc.addIceCandidate(c);
    } else if (m.type === "ice") {
      if (pc.remoteDescription) await pc.addIceCandidate(m.data); else p.q.push(m.data);
    }
  } catch (e) {}
}

async function joinCall(){
  if (!room || local) return;
  try { local = await navigator.mediaDevices.getUserMedia({ video: true, audio: true }); }
  catch (e) {
    try { local = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch (e2) { alert("Permita o uso da câmera e do microfone no navegador para entrar na chamada."); return; }
  }
  $("call").classList.remove("hide"); $("bcall").classList.add("hide");
  tile("me", local, true, "Você");
  callCh = sb.channel("call-" + room.id, { config: { broadcast: { self: false }, presence: { key: sid } } })
    .on("broadcast", { event: "sig" }, ({ payload }) => onSig(payload))
    .on("presence", { event: "join" }, ({ key, newPresences }) => {
      if (key === sid) return;
      names[key] = (newPresences[0] && newPresences[0].n) || "Alguém";
      if (sid > key) offer(key);
    })
    .on("presence", { event: "leave" }, ({ key }) => dropPeer(key))
    .subscribe(async s => { if (s === "SUBSCRIBED") await callCh.track({ n: prof.username }); });
}
function leaveCall(){
  if (callCh) { sb.removeChannel(callCh); callCh = null; }
  Object.keys(peers).forEach(dropPeer);
  if (local) { local.getTracks().forEach(t => t.stop()); local = null; }
  $("grid").textContent = ""; $("call").classList.add("hide");
  if (room) $("bcall").classList.remove("hide");
}
$("bcall").onclick = joinCall;
$("bleave").onclick = leaveCall;
$("bmic").onclick = () => { if (!local) return; const t = local.getAudioTracks()[0]; if (t) { t.enabled = !t.enabled; $("bmic").textContent = t.enabled ? "🎤" : "🔇"; } };
$("bcam").onclick = () => { if (!local) return; const t = local.getVideoTracks()[0]; if (t) { t.enabled = !t.enabled; $("bcam").textContent = t.enabled ? "📷" : "🚫"; } };

// ---------- janelas ----------
function modal(build){
  const b = $("mb"); b.textContent = "";
  build(b);
  const x = el("button", "g", "Fechar"); x.onclick = () => $("mo").classList.add("hide");
  b.appendChild(x); $("mo").classList.remove("hide");
}
function field(b, label, input){ b.appendChild(el("label", null, label)); b.appendChild(input); return input; }

function card(id){
  const p = cache[id]; if (!p) return;
  modal(b => {
    b.appendChild(el("b", null, p.emoji + " " + p.username));
    b.appendChild(el("div", null, (p.show_bio || id === me.id) ? (p.bio || "Sem bio.") : "Este perfil mantém a bio privada."));
  });
}

function newRoom(){ modal(b => {
  const n = field(b, "Nome da sala", el("input")); n.maxLength = 40;
  const ok = el("button", "p", "Criar");
  ok.onclick = async () => {
    if (!n.value.trim()) return;
    const { data, error } = await sb.rpc("create_room", { n: n.value.trim() });
    if (error) return alert(error.message);
    $("mo").classList.add("hide"); await loadRooms(); openRoom(rooms.find(r => r.id === data));
  };
  b.appendChild(ok);
}); }

function joinRoom(){ modal(b => {
  const c = field(b, "Código da sala", el("input"));
  const ok = el("button", "p", "Entrar");
  ok.onclick = async () => {
    const { data, error } = await sb.rpc("join_room", { c: c.value.trim() });
    if (error) return alert(error.message);
    $("mo").classList.add("hide"); await loadRooms(); openRoom(rooms.find(r => r.id === data));
  };
  b.appendChild(ok);
}); }

function settings(){ modal(b => {
  const us = field(b, "Nome de usuário", el("input")); us.value = prof.username; us.maxLength = 24;
  const em = field(b, "Emoji do perfil", el("input")); em.value = prof.emoji; em.maxLength = 4;
  const bio = field(b, "Bio", el("textarea")); bio.value = prof.bio; bio.maxLength = 200;
  const co = field(b, "Cor do nome", el("input")); co.type = "color"; co.value = prof.color;
  const th = field(b, "Tema", el("select"));
  [["dark", "Escuro"], ["light", "Claro"], ["auto", "Automático"]].forEach(o => { const op = el("option", null, o[1]); op.value = o[0]; th.appendChild(op); });
  th.value = prof.theme; th.onchange = () => theme(th.value);
  b.appendChild(el("label", null, "Privacidade"));
  const lb = el("label"); const sh = el("input"); sh.type = "checkbox"; sh.checked = prof.show_bio;
  lb.appendChild(sh); lb.appendChild(document.createTextNode(" Mostrar minha bio para os outros")); b.appendChild(lb);
  const msg = el("div", "ok");
  const ok = el("button", "p", "Salvar");
  ok.onclick = async () => {
    const upd = { username: us.value.trim() || prof.username, emoji: em.value.trim() || "🙂", bio: bio.value, color: co.value, theme: th.value, show_bio: sh.checked };
    const { error } = await sb.from("profiles").update(upd).eq("id", me.id);
    if (error) { msg.style.color = "#e5484d"; msg.textContent = "Não salvou: " + error.message; return; }
    prof = Object.assign(prof, upd); cache[me.id] = prof; theme(prof.theme);
    msg.style.color = ""; msg.textContent = "Salvo ✓";
    if (chan) chan.track({ n: prof.username, e: prof.emoji });
  };
  b.appendChild(ok); b.appendChild(msg);
  const out = el("button", "g", "Sair da conta"); out.onclick = () => { $("mo").classList.add("hide"); sb.auth.signOut(); };
  b.appendChild(out);
}); }
</script>
</body>
</html>
